<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Assistant agent: LangGraph built by AgentBuilder</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .bg { fill: #f6f4ef; }
      .node { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
      .guard { fill: #fff4e5; stroke: #b25e09; stroke-width: 1.5; }
      .llm { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
      .tool { fill: #ecfdf3; stroke: #1a7f37; stroke-width: 1.5; }
      .term { fill: #1a1a1a; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .sub { font-size: 12px; fill: #444; }
      .small { font-size: 11px; fill: #6b6b76; }
      .edge { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .label { font-size: 11.5px; fill: #333; }
      .termtext { font-size: 13px; font-weight: 700; fill: #fff; }
      .frame { fill: none; stroke: #c9c4b8; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect class="bg" width="980" height="560" rx="16"/>
  <text x="24" y="34" class="title" font-size="18">Agent graph (app/agents/builder.py · AgentBuilder)</text>
  <text x="24" y="54" class="small">Every chat turn runs this LangGraph once. Messages come from the `messages` table; the reply is the last message.</text>

  <!-- START -->
  <rect class="term" x="24" y="230" width="84" height="40" rx="20"/>
  <text x="66" y="255" class="termtext" text-anchor="middle">START</text>

  <!-- input_guard -->
  <rect class="guard" x="150" y="200" width="200" height="100" rx="10"/>
  <text x="250" y="226" class="title" text-anchor="middle">input_guard</text>
  <text x="250" y="248" class="sub" text-anchor="middle">MaxLengthGuardrail</text>
  <text x="250" y="266" class="sub" text-anchor="middle">PromptInjectionGuardrail</text>
  <text x="250" y="288" class="small" text-anchor="middle">pure checks, no LLM</text>

  <!-- agent -->
  <rect class="llm" x="420" y="190" width="210" height="120" rx="10"/>
  <text x="525" y="216" class="title" text-anchor="middle">agent</text>
  <text x="525" y="238" class="sub" text-anchor="middle">LLM with tools bound</text>
  <text x="525" y="256" class="sub" text-anchor="middle">prompt: prompts/assistant.md</text>
  <text x="525" y="274" class="sub" text-anchor="middle">model: Settings.llm_model</text>
  <text x="525" y="296" class="small" text-anchor="middle">(any provider: LLM_PROVIDER)</text>

  <!-- tools -->
  <rect class="tool" x="375" y="370" width="300" height="150" rx="10"/>
  <text x="525" y="396" class="title" text-anchor="middle">tools (ToolNode)</text>
  <text x="525" y="420" class="sub" text-anchor="middle">the project's tools, one file each</text>
  <text x="525" y="440" class="sub" text-anchor="middle">in app/tools/&lt;area&gt;/, added with /new-tool</text>
  <text x="525" y="460" class="sub" text-anchor="middle">(a new project has none: the agent</text>
  <text x="525" y="480" class="sub" text-anchor="middle">goes straight to the answer)</text>
  <text x="525" y="504" class="small" text-anchor="middle">built with ToolBuilder · app/tools/registry.py</text>

  <!-- output_guard -->
  <rect class="guard" x="700" y="200" width="200" height="100" rx="10"/>
  <text x="800" y="226" class="title" text-anchor="middle">output_guard</text>
  <text x="800" y="248" class="sub" text-anchor="middle">AllowedLinksGuardrail</text>
  <text x="800" y="266" class="sub" text-anchor="middle">(ALLOWED_LINKS)</text>
  <text x="800" y="288" class="small" text-anchor="middle">replaces an unsafe reply</text>

  <!-- END -->
  <rect class="term" x="758" y="96" width="84" height="40" rx="20"/>
  <text x="800" y="121" class="termtext" text-anchor="middle">END</text>

  <!-- edges -->
  <path class="edge" d="M108,250 L148,250"/>
  <path class="edge" d="M350,250 L418,250"/>
  <text x="384" y="242" class="label" text-anchor="middle">ok</text>

  <path class="edge" d="M250,200 L250,116 L756,116"/>
  <text x="430" y="108" class="label">blocked: canned reply, no LLM call (blocked_by set)</text>

  <path class="edge" d="M490,310 L490,368"/>
  <text x="482" y="344" class="label" text-anchor="end">tool calls</text>
  <path class="edge" d="M560,368 L560,312"/>
  <text x="568" y="344" class="label">tool results</text>

  <path class="edge" d="M630,250 L698,250"/>
  <text x="664" y="242" class="label" text-anchor="middle">answer</text>

  <path class="edge" d="M800,200 L800,138"/>
  <text x="808" y="172" class="label">reply</text>

  <!-- legend -->
  <rect class="frame" x="700" y="370" width="256" height="150" rx="10"/>
  <text x="716" y="394" class="title" font-size="13">Legend</text>
  <rect class="guard" x="716" y="408" width="16" height="12" rx="3"/><text x="740" y="418" class="sub">guardrail node</text>
  <rect class="llm" x="716" y="430" width="16" height="12" rx="3"/><text x="740" y="440" class="sub">LLM node</text>
  <rect class="tool" x="716" y="452" width="16" height="12" rx="3"/><text x="740" y="462" class="sub">tool node</text>
  <text x="716" y="488" class="small">Wiring: app/agents/assistant_agent.py</text>
  <text x="716" y="506" class="small">Traced per turn in Langfuse (chat-turn)</text>
</svg>
